name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 누락된 기본 이미지(assets) 자동 생성
        run: |
          mkdir -p assets
          # 1x1 투명 png 기본 파일 생성 (아이콘 누락 방지)
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > assets/icon.png
          cp assets/icon.png assets/adaptive-icon.png
          cp assets/icon.png assets/splash-icon.png
          cp assets/icon.png assets/favicon.png

      - name: 의존성 패키지 설치
        run: npm install

      - name: Expo Prebuild (네이티브 Android 프로젝트 생성)
        run: npx expo prebuild --platform android --clean

      - name: Gradle 실행 권한 부여
        run: chmod +x android/gradlew

      - name: APK 빌드 (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
