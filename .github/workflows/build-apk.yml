name: Build Android APK (Local Gradle on GitHub)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Java(JDK 17) 환경 세팅
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 의존성 패키지 설치
        run: |
          npm install --legacy-peer-deps

      - name: 5. Expo Prebuild (네이티브 android 폴더 생성)
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: 6. 오프라인 자바스크립트 번들 생성 및 에셋 패키징
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 7. Gradle 빌드 및 APK 생성
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: 8. 빌드된 APK 파일 업로드 (다운로드 제공)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
