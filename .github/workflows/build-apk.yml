name: Build Android APK (Local Gradle on GitHub)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Java(JDK 17) 환경 세팅
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 의존성 패키지 설치
        run: |
          npm install --legacy-peer-deps

      - name: 5. Expo Prebuild (네이티브 android 폴더 생성)
        run: |
          # 1) index.js가 없으면 자동 생성 보정
          if [ ! -f index.js ]; then
            echo "import { registerRootComponent } from 'expo'; import App from './App'; registerRootComponent(App);" > index.js
          fi

          # 2) 에셋 및 JSON 데이터 누락 방지 보정
          mkdir -p assets
          if [ -f main_bg.png ] && [ ! -f assets/main_bg.png ]; then
            cp main_bg.png assets/main_bg.png
          fi
          if [ ! -f assets/history.min.json ]; then
            echo "[]" > assets/history.min.json
          fi
          if [ ! -f assets/latest.json ]; then
            echo '{"returnValue":"fail"}' > assets/latest.json
          fi

          npx expo prebuild --platform android --clean --no-install

      - name: 6. Release 빌드 시 기본 디버그 키스토어 자동 적용
        run: |
          # 릴리즈 서명 키 누락 에러를 방지하기 위해 debug.keystore를 release 서명으로 주입
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

      - name: 7. 완전 오프라인 포함 Release APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: 8. 빌드된 APK 파일 업로드 (다운로드 제공)
        uses: actions/upload-artifact@v4
        with:
          name: lotto-app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
